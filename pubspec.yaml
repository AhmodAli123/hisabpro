name: hisabpro
description: HisabPro — a personal finance manager for tracking daily, weekly, monthly and yearly income and expenses.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management. Lightweight and mature; keeps UI and business logic separate.
  provider: ^6.1.2

  # Persists app preferences (theme, currency) between launches.
  shared_preferences: ^2.3.2

  # Local SQLite storage for offline transaction persistence.
  sqflite: ^2.4.0
  path: ^1.8.4

  # Date and number formatting for multi-currency amounts.
  intl: ^0.19.0
  fl_chart: ^0.60.0
  flutter_local_notifications: ^13.0.0
  image_picker: ^0.8.7+5
  path_provider: ^2.0.14
  file_picker: ^5.2.5
  csv: ^5.0.0
  pdf: ^3.8.1
  printing: ^5.11.0
  timezone: ^0.9.0
  supabase_flutter: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
